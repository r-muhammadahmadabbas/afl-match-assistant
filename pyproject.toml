[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afl-match-assistant"
version = "1.0.0"
description = "Domain-locked AFL chat, match-winner prediction and top-player ranking assistant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Ahmad Abbas" }]
keywords = ["afl", "langgraph", "fastapi", "sports-analytics", "machine-learning"]
dependencies = [
    "langgraph>=0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "scikit-learn>=1.4,<1.7",
    "pandas>=2.0",
    "numpy>=1.26",
    "joblib>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
afl-assistant = "afl_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
